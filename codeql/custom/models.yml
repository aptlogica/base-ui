extensions:
  - addsTo:
      pack: codeql/javascript-all
      extensible: neutralModel  
    data:
      # Simple: these functions make data safe from XSS/injection
      - ["", "Member[sanitizeExternalUrl]", "Argument[0]", "ReturnValue", "manual"]
      - ["", "Member[sanitizeImageSrc]", "Argument[0]", "ReturnValue", "manual"]
      - ["", "Member[sanitizeRichTextHtml]", "Argument[0]", "ReturnValue", "manual"]
      - ["", "Member[stripHTML]", "Argument[0]", "ReturnValue", "manual"]